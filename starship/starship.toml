# Unicode/Emoji preset (no Nerd Fonts required)

"$schema" = 'https://starship.rs/config-schema.json'

# === Common overrides ===

[directory]
read_only = " 🔒"

[git_branch]
symbol = "🌱 "

[git_status]
deleted = "🗑 "

[package]
symbol = "📦 "

# === Languages & tools ===

[bun]
symbol = "🍔 "

[deno]
symbol = "🦕 "

[docker_context]
symbol = "🐳 "

[nodejs]
symbol = "[⬢](bold green) "

[python]
symbol = "🐍 "
