# Every machine. Profiles (config.personal.toml, config.work.toml) add to this.

[settings]
self_update.auto = true # update mise itself weekly

# === Tools ===

# auto_update: update in the background, checked daily.
[tools]
node = { version = "lts", auto_update = true }
bun = { version = "latest", auto_update = true }
pnpm = { version = "latest", auto_update = true }
starship = { version = "latest", auto_update = true }
claude = { version = "latest", auto_update = true } # Claude Code (the claude command)
mas = { version = "latest", auto_update = true } # installs App Store apps
git-lfs = { version = "latest", auto_update = true } # large files in some repos

# === Apps ===

[bootstrap.packages]
"brew-cask:brainfm" = "latest"
"mas:490179405" = "latest" # Okta Verify
"mas:497799835" = "latest" # Xcode

# === Dotfiles ===

# Sources are relative to this file.
[dotfiles]
"~/.zshrc" = { source = "../zsh/.zshrc" }
"~/.config/git/config" = { source = "../git/config" }
"~/.config/git/ignore" = { source = "../git/ignore" }
"~/.config/starship.toml" = { source = "../starship/starship.toml" }

# === macOS settings ===

[bootstrap.macos.dock]
autohide = true

# Dock settings mise has no named option for, or that the Dock stores as decimals.
[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 48.0
"autohide-delay" = 0.0 # show the hidden Dock without a delay
"autohide-time-modifier" = 0.0 # and without the slide animation

[bootstrap.macos.finder]
show_pathbar = true
show_all_files = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

# Applies after logging out and back in.
[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

# === Updates ===

[tasks.update]
description = "Update tools and apps"
# Full paths, because the LaunchAgent runs without your shell's PATH.
run = ["~/.local/bin/mise upgrade", "~/.local/bin/mise bootstrap packages upgrade --yes"]

# Run the update task daily at 7:00, or on wake if the Mac was asleep.
[bootstrap.macos.launchd.agents.mise-update]
program = "~/.local/bin/mise"
args = ["run", "update"]
start_calendar_interval = [{ hour = 7, minute = 0 }]
stdout_path = "~/Library/Logs/mise-update.log"
stderr_path = "~/Library/Logs/mise-update.log"
